<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>m11401012 | Premium Social Post</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'Noto Sans TC', 'sans-serif'],
                    },
                    colors: {
                        'ig-gray': '#fafafa',
                        'accent-blue': '#0095f6',
                    },
                    boxShadow: {
                        'premium': '0 10px 40px -10px rgba(0, 0, 0, 0.08), 0 4px 20px -8px rgba(0, 0, 0, 0.05)',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background: radial-gradient(circle at top left, #f8fafc, #f1f5f9);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .glass-header {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(8px);
        }
        .post-container {
            animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .image-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .image-wrapper:hover img {
            transform: scale(1.03);
        }
        .line-clamp-custom {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .heart-btn:active {
            transform: scale(1.2);
            transition: transform 0.1s;
        }
    </style>
</head>
<body class="antialiased text-slate-900 p-4 md:p-8">

    <main class="w-full max-w-lg mx-auto post-container">
        <!-- Main Post Card -->
        <article class="bg-white border border-slate-100 rounded-3xl overflow-hidden shadow-premium transition-all duration-300">
            
            <!-- Card Header -->
            <header class="flex items-center justify-between px-5 py-4">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-yellow-400 via-red-500 to-purple-600 p-[2px]">
                        <div class="w-full h-full rounded-full bg-white flex items-center justify-center p-[2px]">
                            <div class="w-full h-full rounded-full bg-slate-200 flex items-center justify-center text-xs font-bold text-slate-500">
                                M1
                            </div>
                        </div>
                    </div>
                    <div class="flex flex-col">
                        <span class="font-bold text-sm tracking-tight hover:text-slate-600 cursor-pointer">m11401012</span>
                        <span class="text-[10px] text-slate-400 font-medium">台灣, 台北市</span>
                    </div>
                </div>
                <button class="p-1 text-slate-400 hover:text-slate-600 transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="1"/><circle cx="12" cy="5" r="1"/><circle cx="12" cy="19" r="1"/></svg>
                </button>
            </header>

            <!-- Media Section: 1:1 Image -->
            <div class="image-wrapper relative aspect-square bg-slate-50 overflow-hidden border-y border-slate-50">
                <img src='https://opal.google/board/blobs/44b5efed-c49f-442b-b55f-9391dc381b86' alt='Street Food Post' />
            </div>

            <!-- Interaction Bar -->
            <section class="px-5 pt-4 pb-2">
                <div class="flex items-center justify-between mb-4">
                    <div class="flex items-center gap-4">
                        <button class="heart-btn text-rose-500 hover:text-rose-600 transition-colors">
                            <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                        </button>
                        <button class="text-slate-700 hover:text-slate-500 transition-colors">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
                        </button>
                        <button class="text-slate-700 hover:text-slate-500 transition-colors">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
                        </button>
                    </div>
                    <button class="text-slate-700 hover:text-slate-500 transition-colors">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
                    </button>
                </div>

                <div class="mb-2">
                    <span class="text-sm font-bold text-slate-800">1,248 次贊</span>
                </div>

                <!-- Content Section -->
                <div class="content-text leading-relaxed">
                    <div class="text-[15px] space-y-3">
                        <p class="whitespace-pre-wrap text-slate-800">
                            <span class="font-bold mr-1">m11401012</span>
                            這種跨越街頭巷尾的「香」味，懂的人自然懂！🤤 外皮炸得金黃酥脆，內裡軟嫩多汁，再塞進滿滿的爽脆台式泡菜，這一口下去簡直是人間美味。雖然聞起來很有挑戰性，但吃起來卻是停不下來的快樂，這就是正宗的台灣味浪漫！✨
                        </p>
                        
                        <div class="flex flex-wrap gap-x-2 gap-y-1 text-accent-blue font-medium text-[14px]">
                            <span>#臭豆腐</span>
                            <span>#街頭小吃</span>
                            <span>#台灣美食</span>
                            <span>#宵夜首選</span>
                            <span>#重口味萬歲</span>
                            <span>#美食日常</span>
                        </div>
                    </div>
                </div>

                <div class="mt-4 pb-4">
                    <span class="text-[11px] uppercase tracking-wider text-slate-400 font-bold">1 小時前</span>
                </div>
            </section>

            <!-- Quick Comment Section -->
            <footer class="px-5 py-4 border-t border-slate-50 flex items-center justify-between">
                <div class="flex items-center gap-3 flex-grow">
                    <span class="text-xl">😊</span>
                    <input type="text" placeholder="新增留言..." class="bg-transparent border-none text-sm w-full focus:ring-0 placeholder-slate-400 text-slate-600 outline-none">
                </div>
                <button class="text-accent-blue font-bold text-sm opacity-50 cursor-default hover:opacity-100 transition-opacity">發佈</button>
            </footer>
        </article>
    </main>

    <script>
        // Simple Interaction: Double tap to heart animation placeholder
        const imgWrapper = document.querySelector('.image-wrapper');
        imgWrapper.addEventListener('dblclick', function(e) {
            const heart = document.createElement('div');
            heart.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 24 24" fill="white" style="filter: drop-shadow(0 0 10px rgba(0,0,0,0.3))"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>`;
            heart.style.position = 'absolute';
            heart.style.top = '50%';
            heart.style.left = '50%';
            heart.style.transform = 'translate(-50%, -50%) scale(0)';
            heart.style.transition = 'transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s';
            heart.style.pointerEvents = 'none';
            imgWrapper.appendChild(heart);

            setTimeout(() => {
                heart.style.transform = 'translate(-50%, -50%) scale(1.2)';
            }, 10);
            
            setTimeout(() => {
                heart.style.transform = 'translate(-50%, -50%) scale(1)';
                heart.style.opacity = '0';
            }, 700);

            setTimeout(() => {
                heart.remove();
            }, 1000);
        });
    </script>
</body>
</html>
